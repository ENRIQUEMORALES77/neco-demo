<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FAF7F2">
  <title>Neco Buffet · Alérgenos</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&display=swap">
  <link rel="stylesheet" href="css/estilos.css?v=13">
  <style>
    .al-cab h1 { font: 600 27px/1.15 var(--serif); margin: 6px 0 2px; }
    .al-cab p { margin: 0; color: var(--tinta-2); }
    .aviso-al { display: flex; gap: 10px; margin: 14px 0; padding: 12px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45; }
    .aviso-al.ej { background: #FFF1D6; color: #6B4A10; border: 1.5px dashed #E2A93B; }
    .aviso-al.ok { background: var(--verde-claro); color: var(--verde-osc); }
    .aviso-al b { display: block; }
    .bloque-f { background: var(--papel); border: 1px solid var(--borde); border-radius: var(--radio); padding: 16px; margin-bottom: 14px; }
    .bloque-f h2 { font: 600 17px/1.3 var(--serif); margin: 0 0 10px; }
    .al-chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .al-chip {
      display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 10px; border-radius: 12px;
      border: 1.5px solid var(--borde); background: var(--papel); font-size: 14.5px; font-weight: 600; color: var(--tinta-2); cursor: pointer; text-align: left;
    }
    .al-chip .ico { font-size: 19px; width: 24px; text-align: center; flex: none; }
    .al-chip[aria-pressed="true"] { background: #FBEDE6; border-color: var(--terracota); color: #8E3A1E; }
    .al-chip[aria-pressed="true"]::after { content: "✕"; margin-left: auto; font-size: 13px; }
    .dietas { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .dietas .al-chip { flex: 1; min-width: 130px; }
    .dietas .al-chip[aria-pressed="true"] { background: var(--verde-claro); border-color: var(--verde); color: var(--verde-osc); }
    .dietas .al-chip[aria-pressed="true"]::after { content: "✓"; }
    .opc { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; color: var(--tinta-2); }
    .opc input { width: 20px; height: 20px; accent-color: var(--verde-osc); }
    .buscar { margin-top: 12px; }
    .resumen { position: sticky; top: 52px; z-index: 5; margin: 0 -16px 10px; padding: 10px 16px; background: rgba(250,247,242,.95); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-weight: 700; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .resumen button { border: 0; background: none; color: var(--verde-osc); font-weight: 700; font-size: 14px; cursor: pointer; padding: 6px 0; }
    .cat-al { margin: 16px 0 8px; font: 600 16px/1.3 var(--serif); color: var(--tinta-2); }
    .plato { background: var(--papel); border: 1px solid var(--borde); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
    .plato-cab { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .plato-cab strong { font-size: 15.5px; }
    .dieta-tag { flex: none; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--verde-claro); color: var(--verde-osc); }
    .al-lista { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .al-lista span { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--crema-2); font-size: 12.5px; color: var(--tinta-2); }
    .al-lista span.choca { background: #FBEDE6; color: #8E3A1E; font-weight: 700; }
    .sin-al { margin-top: 6px; font-size: 13px; color: var(--ok); font-weight: 600; }
    .trazas { margin-top: 6px; font-size: 12.5px; color: var(--tinta-3); }
    details.no-aptos { margin-top: 18px; }
    details.no-aptos summary { cursor: pointer; font-weight: 700; color: var(--tinta-2); padding: 10px 0; }
    details.no-aptos .plato { opacity: .75; }
    .motivo { margin-top: 5px; font-size: 13px; color: #8E3A1E; font-weight: 600; }
    .vacio { text-align: center; color: var(--tinta-3); padding: 20px; }
    @media (min-width: 560px) { .al-chips { grid-template-columns: repeat(3, 1fr); } }
  </style>
</head>
<body>
  <header class="barra">
    <a class="barra-logo" id="volver-logo" href="./" aria-label="Neco Buffet"><img src="img/logo-neco.png" alt="Neco Buffet" width="94" height="18"></a>
    <div class="idioma" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es" aria-pressed="true">ES</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>
  <main class="contenido" id="al"></main>
  <footer class="pie"><a id="volver" href="./"></a><p id="pie-texto"></p></footer>

  <script src="config.js?v=13"></script>
  <script src="js/comun.js?v=13"></script>
  <script src="js/carta.js?v=13"></script>
  <script>
  (function () {
    var C = window.CONFIG, K = window.CARTA, N = window.NECO;
    var p = new URLSearchParams(location.search);
    var localId = C.locales[p.get("local")] ? p.get("local") : null;
    var LS = "neco-alergenos";
    var T = {
      es: { titulo: "Carta de alérgenos", que: "¿Qué no puedes tomar?", dieta: "Dieta", veg: "Vegetariano", vegano: "Vegano",
        trazas: "Excluir también los platos que pueden contener trazas", buscar: "Buscar un plato…", aptos: "Puedes tomar {n} de {t} platos",
        todos: "Mostrando los {t} platos", limpiar: "Quitar filtros", noAptos: "No aptos para ti ({n})", contiene: "Contiene", puede: "Puede contener",
        sin: "Sin alérgenos de declaración obligatoria", motivo: "No apto: ", ejT: "Carta de ejemplo para la demostración",
        ejX: "No la uses para decidir qué comer: los alérgenos reales los confirma cocina. Ante cualquier duda, consulta al personal.",
        okT: "Revisada por cocina el {f}", okX: "La oferta del buffet cambia cada día. Ante cualquier duda, consulta al personal antes de servirte.",
        volver: "Volver", ninguno: "Ningún plato coincide con la búsqueda.", vegTag: "Vegetariano", veganoTag: "Vegano", dietaNo: "no es " },
      en: { titulo: "Allergen menu", que: "What can't you eat?", dieta: "Diet", veg: "Vegetarian", vegano: "Vegan",
        trazas: "Also exclude dishes that may contain traces", buscar: "Search a dish…", aptos: "You can have {n} of {t} dishes",
        todos: "Showing all {t} dishes", limpiar: "Clear filters", noAptos: "Not suitable for you ({n})", contiene: "Contains", puede: "May contain",
        sin: "No declarable allergens", motivo: "Not suitable: ", ejT: "Example menu for the demo",
        ejX: "Do not use it to decide what to eat: the kitchen confirms the real allergens. If in doubt, please ask our staff.",
        okT: "Checked by the kitchen on {f}", okX: "The buffet changes every day. If in doubt, please ask our staff before serving yourself.",
        volver: "Back", ninguno: "No dish matches your search.", vegTag: "Vegetarian", veganoTag: "Vegan", dietaNo: "not " },
    };
    var lang = p.get("lang") === "en" || p.get("lang") === "es" ? p.get("lang") : (function () { try { return localStorage.getItem("neco-lang") || "es"; } catch (e) { return "es"; } })();
    var sel = leer(), dieta = "", conTrazas = true, texto = "";
    function leer() { try { return JSON.parse(localStorage.getItem(LS) || "[]"); } catch (e) { return []; } }
    function guardar() { try { localStorage.setItem(LS, JSON.stringify(sel)); } catch (e) {} }
    function t(k, v) { return N.fmt(T[lang][k], v); }
    function nom(o) { return o[lang] || o.es; }
    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

    var platos = K.platos.filter(function (x) { return !x.locales || !localId || x.locales.indexOf(localId) !== -1; });

    function motivo(x) {
      var choque = x.alergenos.filter(function (a) { return sel.indexOf(a) !== -1; });
      var tr = conTrazas ? x.trazas.filter(function (a) { return sel.indexOf(a) !== -1; }) : [];
      var m = [];
      if (choque.length) m.push(t("contiene") + " " + choque.map(function (a) { return nom(K.ALERGENOS[a]).toLowerCase(); }).join(", "));
      if (tr.length) m.push(t("puede").toLowerCase() + " " + tr.map(function (a) { return nom(K.ALERGENOS[a]).toLowerCase(); }).join(", "));
      if (dieta === "vegano" && x.dieta !== "vegano") m.push(t("dietaNo") + t("vegano").toLowerCase());
      if (dieta === "vegetariano" && !x.dieta) m.push(t("dietaNo") + t("veg").toLowerCase());
      return m;
    }

    function tarjeta(x, m) {
      var al = x.alergenos.map(function (a) {
        return '<span class="' + (sel.indexOf(a) !== -1 ? "choca" : "") + '" title="' + esc(nom(K.ALERGENOS[a])) + '">' + K.ALERGENOS[a].ico + ' ' + esc(nom(K.ALERGENOS[a])) + '</span>';
      }).join("");
      return '<div class="plato"><div class="plato-cab"><strong>' + esc(nom(x)) + '</strong>' +
        (x.dieta ? '<span class="dieta-tag">' + t(x.dieta === "vegano" ? "veganoTag" : "vegTag") + '</span>' : '') + '</div>' +
        (al ? '<div class="al-lista">' + al + '</div>' : '<div class="sin-al">✓ ' + t("sin") + '</div>') +
        (x.trazas.length ? '<div class="trazas">' + t("puede") + ': ' + x.trazas.map(function (a) { return K.ALERGENOS[a].ico + " " + nom(K.ALERGENOS[a]).toLowerCase(); }).join(", ") + '</div>' : '') +
        (m && m.length ? '<div class="motivo">' + t("motivo") + esc(m.join(" · ")) + '</div>' : '') + '</div>';
    }

    function renderLista() {
      var q = texto.trim().toLowerCase();
      var visibles = platos.filter(function (x) { return !q || nom(x).toLowerCase().indexOf(q) !== -1 || x.es.toLowerCase().indexOf(q) !== -1; });
      var aptos = visibles.filter(function (x) { return !motivo(x).length; });
      var no = visibles.filter(function (x) { return motivo(x).length; });
      var hayFiltro = sel.length || dieta;
      var html = '<div class="resumen" aria-live="polite"><span>' + (hayFiltro ? t("aptos", { n: aptos.length, t: visibles.length }) : t("todos", { t: visibles.length })) + '</span>' +
        (hayFiltro ? '<button type="button" id="limpiar">' + t("limpiar") + '</button>' : '') + '</div>';
      if (!visibles.length) html += '<p class="vacio">' + t("ninguno") + '</p>';
      Object.keys(K.CATEGORIAS).forEach(function (c) {
        var g = aptos.filter(function (x) { return x.cat === c; });
        if (g.length) html += '<h3 class="cat-al">' + esc(nom(K.CATEGORIAS[c])) + '</h3>' + g.map(function (x) { return tarjeta(x); }).join("");
      });
      if (no.length) html += '<details class="no-aptos"><summary>' + t("noAptos", { n: no.length }) + '</summary>' + no.map(function (x) { return tarjeta(x, motivo(x)); }).join("") + '</details>';
      document.getElementById("lista").innerHTML = html;
    }

    function render() {
      document.documentElement.lang = lang;
      document.querySelectorAll(".idioma button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang)); });
      var l = localId ? C.locales[localId] : null, volver = localId ? "./?local=" + localId : "./";
      document.getElementById("volver").href = document.getElementById("volver-logo").href = volver;
      document.getElementById("volver").textContent = "← " + t("volver");
      document.getElementById("pie-texto").textContent = C.marca.pie;
      document.title = (l ? l.nombre : C.marca.nombre) + " · " + t("titulo");
      var aviso = K.revisada
        ? '<div class="aviso-al ok"><span>✓</span><div><b>' + t("okT", { f: N.fechaDeIso(K.revisada).toLocaleDateString(lang === "en" ? "en-GB" : "es-ES") }) + '</b>' + t("okX") + '</div></div>'
        : '<div class="aviso-al ej"><span>⚠</span><div><b>' + t("ejT") + '</b>' + t("ejX") + '</div></div>';
      document.getElementById("al").innerHTML =
        '<div class="al-cab"><h1>' + t("titulo") + '</h1><p>' + esc(l ? l.nombre : C.marca.nombre) + '</p></div>' + aviso +
        '<section class="bloque-f"><h2>' + t("que") + '</h2><div class="al-chips">' +
          Object.keys(K.ALERGENOS).map(function (a) {
            return '<button type="button" class="al-chip" data-al="' + a + '" aria-pressed="' + (sel.indexOf(a) !== -1) + '"><span class="ico" aria-hidden="true">' + K.ALERGENOS[a].ico + '</span>' + esc(nom(K.ALERGENOS[a])) + '</button>';
          }).join("") + '</div>' +
          '<div class="dietas" role="group" aria-label="' + t("dieta") + '">' +
            '<button type="button" class="al-chip" data-dieta="vegetariano" aria-pressed="' + (dieta === "vegetariano") + '"><span class="ico">🥕</span>' + t("veg") + '</button>' +
            '<button type="button" class="al-chip" data-dieta="vegano" aria-pressed="' + (dieta === "vegano") + '"><span class="ico">🌱</span>' + t("vegano") + '</button></div>' +
          '<label class="opc"><input type="checkbox" id="trazas"' + (conTrazas ? " checked" : "") + '>' + t("trazas") + '</label>' +
          '<label class="campo buscar"><input type="search" id="buscar" placeholder="' + t("buscar") + '" value="' + esc(texto) + '"></label>' +
        '</section><div id="lista"></div>';
      renderLista();
    }

    document.addEventListener("click", function (e) {
      var a = e.target.closest("[data-al]"), d = e.target.closest("[data-dieta]"), lg = e.target.closest("[data-lang]");
      if (a) {
        var k = a.getAttribute("data-al"), i = sel.indexOf(k);
        if (i === -1) sel.push(k); else sel.splice(i, 1);
        a.setAttribute("aria-pressed", String(i === -1)); guardar(); renderLista();
      } else if (d) {
        dieta = dieta === d.getAttribute("data-dieta") ? "" : d.getAttribute("data-dieta");
        document.querySelectorAll("[data-dieta]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.getAttribute("data-dieta") === dieta)); });
        renderLista();
      } else if (e.target.id === "limpiar") {
        sel = []; dieta = ""; guardar(); render();
      } else if (lg && lg.getAttribute("data-lang") !== lang) {
        lang = lg.getAttribute("data-lang");
        try { localStorage.setItem("neco-lang", lang); } catch (err) {}
        render();
      }
    });
    document.addEventListener("input", function (e) {
      if (e.target.id === "buscar") { texto = e.target.value; renderLista(); }
      if (e.target.id === "trazas") { conTrazas = e.target.checked; renderLista(); }
    });
    render();
  })();
  </script>
</body>
</html>
