<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Neco Buffet · Expositor de mesa A6</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&display=swap">
  <style id="tam-pagina">@page { size: 105mm 148mm; margin: 0; }</style>
  <style>
    :root {
      --verde: #6E8273; --verde-osc: #4F6154; --crema: #FAF7F2; --crema-2: #F3EDE3;
      --tinta: #1E1E1C; --tinta-2: #55534E; --tinta-3: #85827B; --terracota: #C8623E; --borde: #E6DFD3;
      --serif: "Lora", Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #E9E4DA; color: var(--tinta); font: 14px/1.45 var(--sans); }

    /* ---------- controles (solo pantalla) ---------- */
    .controles {
      position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end;
      padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--borde);
    }
    .controles h1 { font: 600 17px/1.2 var(--serif); margin: 0 12px 6px 0; width: 100%; }
    .controles label { display: grid; gap: 3px; font-size: 12px; font-weight: 600; color: var(--tinta-2); }
    .controles select, .controles input[type=number] {
      min-height: 36px; padding: 6px 10px; border: 1.5px solid var(--borde); border-radius: 9px; font: inherit; font-size: 14px; background: #fff;
    }
    .controles input[type=number] { width: 76px; }
    .controles .check { display: flex; align-items: center; gap: 6px; font-size: 13px; min-height: 36px; }
    .controles button {
      min-height: 38px; padding: 8px 16px; border: 0; border-radius: 10px; background: var(--verde-osc); color: #fff;
      font: inherit; font-weight: 700; cursor: pointer;
    }
    .ayuda { width: 100%; margin: 0; font-size: 12.5px; color: var(--tinta-3); }

    .hojas { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; padding: 22px 12px 40px; }
    .item { display: grid; gap: 6px; justify-items: center; }
    .url-nfc { max-width: 105mm; font: 11px/1.35 ui-monospace, Consolas, monospace; color: var(--tinta-2); word-break: break-all; text-align: center; }
    .url-nfc b { font-family: var(--sans); }

    /* ---------- expositor A6 ---------- */
    .a6 {
      width: 105mm; height: 148mm; position: relative; overflow: hidden;
      background: var(--crema); display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 6px 24px rgba(0, 0, 0, .14);
    }
    .a6 .logo-zona { width: 100%; height: 27mm; display: grid; place-items: center; padding-top: 3mm; }
    .a6 .logo-zona img { height: 11mm; width: auto; }
    .a6 .hueco-logo {
      width: 52mm; height: 17mm; border: 0.4mm dashed #B9B1A2; border-radius: 3mm; display: grid; place-items: center;
      font-size: 8pt; letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-3);
    }
    .a6 .titulo { font: 600 17pt/1.1 var(--serif); margin: 0 0 1mm; text-align: center; }
    .a6 .instruccion {
      display: flex; align-items: center; gap: 2mm; margin: 0 0 4mm; font-size: 10.5pt; font-weight: 700; color: var(--verde-osc);
    }
    .a6 .instruccion svg { width: 5mm; height: 5mm; flex: none; }
    .a6 .zona-qr { position: relative; display: flex; align-items: center; gap: 4mm; }
    .a6 .qr { width: 46mm; height: 46mm; padding: 3mm; background: #fff; border-radius: 4mm; box-shadow: 0 0.4mm 1.5mm rgba(0,0,0,.08); }
    .a6 .qr svg { width: 100%; height: 100%; display: block; }
    .a6 .nfc {
      width: 22mm; height: 22mm; border-radius: 50%; border: 0.5mm dashed var(--verde);
      display: grid; place-items: center; text-align: center; color: var(--verde-osc); background: rgba(110,130,115,.07);
    }
    .a6 .nfc svg { width: 9mm; height: 9mm; margin: 0 auto -0.5mm; display: block; }
    .a6 .nfc span { font-size: 6.5pt; font-weight: 800; letter-spacing: .08em; }
    .a6 .opciones { display: flex; gap: 2.5mm; margin: 5mm 0 0; font-size: 7.5pt; color: var(--tinta-2); font-weight: 600; }
    .a6 .opciones span { padding: 1mm 2.4mm; border-radius: 99px; background: var(--crema-2); white-space: nowrap; }
    .a6 .en { margin: 2.5mm 0 0; font: italic 500 8.5pt/1.2 var(--serif); color: var(--tinta-3); }
    .a6 .pie-a6 {
      position: absolute; left: 0; right: 0; bottom: 0; height: 15mm; padding: 0 6mm;
      display: flex; align-items: center; justify-content: space-between; background: var(--verde-osc); color: #fff;
    }
    .a6 .mesa-n { font: 600 15pt/1 var(--serif); white-space: nowrap; }
    .a6 .mesa-n small { display: block; font: 600 6.5pt/1.3 var(--sans); letter-spacing: .1em; text-transform: uppercase; opacity: .75; margin-bottom: .6mm; }
    .a6 .local-n { text-align: right; font-size: 7.5pt; line-height: 1.35; opacity: .95; }
    .a6 .local-n b { display: block; font-size: 8.5pt; }
    .a6 .deco { position: absolute; width: 30mm; height: 30mm; opacity: .95; }
    .a6 .deco.d1 { right: -9mm; top: 9mm; }
    .a6 .deco.d2 { left: -11mm; top: 13mm; width: 26mm; height: 26mm; }

    /* 4 por hoja A4 */
    body.a4 .hojas { gap: 0; }
    .hoja-a4 { width: 210mm; height: 296mm; display: grid; grid-template-columns: 105mm 105mm; grid-template-rows: 148mm 148mm; background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.14); }
    .hoja-a4 .a6 { box-shadow: none; outline: 0.2mm dashed #D8D1C4; outline-offset: -0.1mm; }

    @media print {
      body { background: none; }
      .controles, .url-nfc { display: none !important; }
      .hojas { display: block; padding: 0; }
      .item { display: block; }
      .a6, .hoja-a4 { box-shadow: none; break-after: page; page-break-after: always; }
      .hoja-a4 .a6 { break-after: auto; page-break-after: auto; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <form class="controles" id="controles">
    <h1>Expositor de mesa A6 · Neco Buffet</h1>
    <label>Local
      <select name="local" id="c-local"></select>
    </label>
    <label>Tipo
      <select name="modo" id="c-modo">
        <option value="entrada">Entrada (sin nº de mesa)</option>
        <option value="mesas">Mesas</option>
      </select>
    </label>
    <label id="l-desde">Desde mesa <input type="number" name="desde" id="c-desde" min="1" value="1"></label>
    <label id="l-hasta">Hasta mesa <input type="number" name="hasta" id="c-hasta" min="1" value="4"></label>
    <label>Formato
      <select name="formato" id="c-formato">
        <option value="a6">A6 individual (105 × 148 mm)</option>
        <option value="a4">4 por hoja A4</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="c-hueco"> Hueco vacío para logo</label>
    <button type="button" id="imprimir">Imprimir / Guardar PDF</button>
    <p class="ayuda">Debajo de cada expositor aparece la URL que hay que grabar en su pegatina NFC (lleva <b>src=nfc</b>; el QR lleva <b>src=qr</b> para distinguir en el panel cómo entra cada cliente). Al imprimir, elige «Tamaño real / 100 %» y sin márgenes.</p>
  </form>

  <div class="hojas" id="hojas"></div>

  <script src="config.js?v=8"></script>
  <script src="js/comun.js?v=8"></script>
  <script src="js/vendor/qrcode.js?v=8"></script>
  <script>
  (function () {
    var C = window.CONFIG, N = window.NECO;
    var ids = Object.keys(C.locales);
    var $ = function (id) { return document.getElementById(id); };
    var p = new URLSearchParams(location.search);

    $("c-local").innerHTML = '<option value="todos">Todos (uno por local)</option>' +
      ids.map(function (id) { return '<option value="' + id + '">' + C.locales[id].nombre + '</option>'; }).join("");
    $("c-local").value = C.locales[p.get("local")] ? p.get("local") : "todos";
    if (p.get("modo") === "mesas") $("c-modo").value = "mesas";
    if (p.get("desde")) $("c-desde").value = p.get("desde");
    if (p.get("hasta")) $("c-hasta").value = p.get("hasta");
    if (p.get("formato") === "a4") $("c-formato").value = "a4";
    if (p.get("hueco") === "1") $("c-hueco").checked = true;

    var NFC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="3" width="9" height="18" rx="2"/><path d="M10 18h2"/><path d="M18.5 8.5a5 5 0 0 1 0 7M20.8 6.2a8.2 8.2 0 0 1 0 11.6"/></svg>';

    function svgQR(texto) {
      var qr = qrcode(0, "M");
      qr.addData(texto);
      qr.make();
      var n = qr.getModuleCount(), d = "";
      for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (qr.isDark(r, c)) d += "M" + c + " " + r + "h1v1h-1z";
      return '<svg viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="crispEdges" aria-label="QR"><path fill="#24302A" d="' + d + '"/></svg>';
    }

    function tarjeta(id, mesa) {
      var l = C.locales[id], hueco = $("c-hueco").checked;
      return '<div class="a6">' +
        '<img class="deco d1" src="img/plato-paella.webp" alt=""><img class="deco d2" src="img/plato-ensalada.webp" alt="">' +
        '<div class="logo-zona">' + (hueco ? '<div class="hueco-logo">Logo</div>' : '<img src="' + C.marca.logo + '" alt="' + C.marca.nombre + '">') + '</div>' +
        '<p class="titulo">Tu opinión cuenta</p>' +
        '<p class="instruccion">' + NFC + 'Acerca tu móvil o escanea el QR</p>' +
        '<div class="zona-qr"><div class="qr">' + svgQR(N.urlLocal(id, mesa, "qr")) + '</div>' +
        '<div class="nfc">' + NFC.replace("<svg", '<svg aria-hidden="true"') + '<span>NFC</span></div></div>' +
        '<div class="opciones"><span>⭐ Reseña en Google</span><span>Platos de hoy</span><span>Grupos</span></div>' +
        '<p class="en">Tap your phone or scan the QR code</p>' +
        '<div class="pie-a6"><div class="mesa-n">' + (mesa ? '<small>Mesa · Table</small>' + mesa : '<small>Welcome</small>Bienvenidos') + '</div>' +
        '<div class="local-n"><b>' + l.nombre + '</b>' + C.dominioVisible + '</div></div>' +
        '</div>';
    }

    function render() {
      var local = $("c-local").value, modo = $("c-modo").value, formato = $("c-formato").value;
      $("l-desde").hidden = $("l-hasta").hidden = modo !== "mesas";
      var lista = [];
      (local === "todos" ? ids : [local]).forEach(function (id) {
        if (modo === "entrada") { lista.push([id, ""]); return; }
        var desde = Math.max(1, +$("c-desde").value || 1), hasta = Math.min(C.locales[id].mesas, Math.max(desde, +$("c-hasta").value || desde));
        for (var m = desde; m <= hasta; m++) lista.push([id, String(m)]);
      });
      document.body.classList.toggle("a4", formato === "a4");
      $("tam-pagina").textContent = formato === "a4" ? "@page { size: 210mm 297mm; margin: 0; }" : "@page { size: 105mm 148mm; margin: 0; }";

      if (formato === "a4") {
        var html = "";
        for (var i = 0; i < lista.length; i += 4) {
          html += '<div class="hoja-a4">' + lista.slice(i, i + 4).map(function (x) { return tarjeta(x[0], x[1]); }).join("") + '</div>';
        }
        $("hojas").innerHTML = html;
      } else {
        $("hojas").innerHTML = lista.map(function (x) {
          return '<div class="item">' + tarjeta(x[0], x[1]) +
            '<div class="url-nfc"><b>NFC:</b> ' + N.urlLocal(x[0], x[1], "nfc") + '</div></div>';
        }).join("");
      }
    }

    $("controles").addEventListener("input", render);
    $("controles").addEventListener("change", render);
    $("imprimir").addEventListener("click", function () { window.print(); });
    render();
  })();
  </script>
</body>
</html>
